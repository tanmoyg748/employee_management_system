<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Edit Employee</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input
            type="text"
            name="name"
            value="{{ employee.name }}"
            required
        >

        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            value="{{ employee.email }}"
            required
        >

        <br><br>

        <label>Salary:</label>
        <input
            type="number"
            name="salary"
            value="{{ employee.salary }}"
            required
        >

        <br><br>

        <button type="submit">Update Employee</button>
    </form>

    <br>

    <a href="{% url 'employee_list' %}">
        ← Back to Employee List
    </a>

</body>
</html>
